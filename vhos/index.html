<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VHOS – nový projekt</title>
  <style>
    :root {
      --zelena: #2f6b3c;
      --hneda: #6b4f2f;
      --svetla: #f4f1ea;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--svetla);
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .karta {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
    }
    h1 { color: var(--zelena); font-size: 1.8rem; margin-bottom: 8px; }
    .odznak {
      display: inline-block;
      background: var(--zelena);
      color: #fff;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: .8rem;
      margin-bottom: 16px;
    }
    p { line-height: 1.6; color: #555; margin-top: 12px; }
    .patka { margin-top: 24px; font-size: .8rem; color: #999; }
  </style>
</head>
<body>
  <main class="karta">
    <span class="odznak">VHOS</span>
    <h1>Nový projekt VHOS</h1>
    <p>Tato složka je připravená. Obsah se doplní, jakmile bude jasné,
       co má projekt umět.</p>
    <p class="patka">MojeBudky.cz · projekt VHOS</p>
  </main>
</body>
</html>
