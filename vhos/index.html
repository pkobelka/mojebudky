<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VHOS – rozcestník</title>
  <style>
    :root {
      --zelena: #2f6b3c;
      --zelena-tmava: #234f2d;
      --hneda: #6b4f2f;
      --svetla: #f4f1ea;
      --karta: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--svetla);
      color: #222;
      min-height: 100vh;
      padding: 32px 20px 60px;
    }
    header {
      max-width: 900px;
      margin: 0 auto 28px;
      text-align: center;
    }
    .odznak {
      display: inline-block;
      background: var(--zelena);
      color: #fff;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 5px 16px;
      border-radius: 999px;
      font-size: .8rem;
    }
    header h1 {
      color: var(--zelena-tmava);
      font-size: 1.9rem;
      margin-top: 12px;
    }
    header p { color: #666; margin-top: 8px; }

    /* Mřížka dlaždic */
    .mrizka {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }
    .dlazdice {
      background: var(--karta);
      border-radius: 16px;
      box-shadow: 0 6px 22px rgba(0,0,0,.07);
      padding: 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform .15s ease, box-shadow .15s ease;
      border: 1px solid #eee;
    }
    .dlazdice:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,.12);
    }
    .dlazdice .ikona { font-size: 2rem; }
    .dlazdice h2 { font-size: 1.15rem; color: var(--zelena-tmava); }
    .dlazdice p { font-size: .9rem; color: #666; line-height: 1.5; }

    /* Prázdná dlaždice – místo pro další věc */
    .pridat {
      border: 2px dashed #c7c0b2;
      background: transparent;
      box-shadow: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #9a927f;
      min-height: 150px;
    }
    .pridat:hover { transform: none; box-shadow: none; border-color: var(--zelena); color: var(--zelena); }

    footer { text-align: center; margin-top: 40px; font-size: .8rem; color: #999; }
  </style>
</head>
<body>
  <header>
    <span class="odznak">VHOS</span>
    <h1>Rozcestník VHOS</h1>
    <p>Věci k řešení – klikni na dlaždici.</p>
  </header>

  <main class="mrizka">

    <!-- ===================================================================
         JAK PŘIDAT NOVOU VĚC (dlaždici):
         Zkopíruj blok <a class="dlazdice">…</a> níže, změň:
           - href="slozka/"   → adresa nové věci (podsložka nebo odkaz)
           - ikonu (emoji), nadpis <h2> a popis <p>
         =================================================================== -->

    <a class="dlazdice" href="https://pkobelka.github.io/aquacontrol/">
      <span class="ikona">💧</span>
      <h2>AquaControl</h2>
      <p>Evidence mimořádných událostí na vodárenské infrastruktuře.</p>
    </a>

    <!-- Sem přibudou další dlaždice… -->

    <a class="dlazdice pridat" href="#">
      <span class="ikona">＋</span>
      <span>Zatím prázdné<br>místo pro další věc</span>
    </a>

  </main>

  <footer>MojeBudky.cz · rozcestník VHOS</footer>
</body>
</html>
