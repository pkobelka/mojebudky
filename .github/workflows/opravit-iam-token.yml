name: Opravit oprávnění pro vydávání přihlašovacích tokenů

# Cloud Function budkyLoginReq vydává custom token přes admin.auth().createCustomToken().
# Běhový účet funkcí nemá privátní klíč, takže podpis dělá IAM Service Account
# Credentials API - a k tomu potřebuje účet roli "Service Account Token Creator"
# sám na sobě. Ve Firebase projektech tahle role často chybí a projeví se to až
# za běhu: heslo se ověří správně, ale token se nevydá.
#
# Workflow je idempotentní - když už je role přidělená, jen to vypíše.
# Nic nemaže a nic jiného nemění.

on:
  workflow_dispatch:

jobs:
  iam:
    runs-on: ubuntu-latest
    steps:
      - name: Přihlášení k Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Nastav gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: moje-budky

      - name: Stav před zásahem
        run: |
          SA="moje-budky@appspot.gserviceaccount.com"
          echo "Běhový účet funkcí (1. generace): $SA"
          echo "--- role, které na sobě účet má ---"
          gcloud iam service-accounts get-iam-policy "$SA" \
            --project moje-budky --format='value(bindings.role)' || true

      - name: Zapni IAM Service Account Credentials API
        run: gcloud services enable iamcredentials.googleapis.com --project moje-budky

      - name: Přiděl roli Service Account Token Creator
        run: |
          SA="moje-budky@appspot.gserviceaccount.com"
          if gcloud iam service-accounts add-iam-policy-binding "$SA" \
               --project moje-budky \
               --member "serviceAccount:$SA" \
               --role "roles/iam.serviceAccountTokenCreator"; then
            echo "Role přidělena."
            exit 0
          fi

          cat <<'NAVOD'

          ============================================================
          Roli se nepodařilo přidělit z CI.

          Servisní účet uložený v secretu FIREBASE_SERVICE_ACCOUNT
          (firebase-adminsdk-…) nemá právo iam.serviceAccounts.setIamPolicy.
          To je v pořádku - Admin SDK účet ho běžně nemá a rozšiřovat mu
          oprávnění kvůli tomuhle jednorázovému kroku nedává smysl.

          Udělej to prosím ručně, je to na minutu:

            1. https://console.cloud.google.com/iam-admin/serviceaccounts?project=moje-budky
            2. Otevři účet  moje-budky@appspot.gserviceaccount.com
            3. Záložka  PERMISSIONS  ->  GRANT ACCESS
            4. New principals:  moje-budky@appspot.gserviceaccount.com
               (ano, ten samý účet - přiděluje se sám sobě)
            5. Role:  Service Account Token Creator
            6. Save

          Pozor: krok 2 platí pro funkce 1. generace, které běží pod
          účtem <projekt>@appspot.gserviceaccount.com. Kdyby funkce
          běžely pod jiným účtem, je vidět v Cloud Console u funkce
          budkyLoginReq v kolonce Service account.

          Zapnutí IAM Service Account Credentials API (krok výše) už
          proběhlo, to se povedlo.
          ============================================================
          NAVOD
          exit 1

      - name: Stav po zásahu
        run: |
          SA="moje-budky@appspot.gserviceaccount.com"
          echo "--- role, které na sobě účet má teď ---"
          gcloud iam service-accounts get-iam-policy "$SA" \
            --project moje-budky --format='value(bindings.role)'
          echo
          echo "Hotovo. Změna se projeví do minuty, pak zkus přihlášení znovu."
