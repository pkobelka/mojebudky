name: Deploy na WEDOS FTP (_test)

on:
  push:
    branches:
      - main
    paths-ignore:
      - functions/**
      - '*.py'
      - PLAN.md
      - data/*.csv
      - .github/workflows/**
  workflow_dispatch:
    inputs:
      plne_nahrani:
        description: 'Nahrát VŠECHNY soubory znovu (když na serveru něco chybí)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vygeneruj číslo verze a vynuť čerstvou cache
        run: |
          sed -i "s/__MB_VERZE__/${{ github.run_number }}/; s/__MB_CAS__/$(TZ='Europe/Prague' date '+%-d.%-m.%Y %H:%M')/" index.html

      - name: Nahraj na FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTP účet je u WEDOSu už nasměrovaný do _test adresáře, takže kořen účtu ("/") je _test
          server-dir: /
          # Deploy nahrává jen soubory, které se liší od stavu zapsaného
          # v .ftp-deploy-sync-state.json NA SERVERU. Když tedy soubor ze
          # serveru zmizí jinak než deployem, stav o tom neví a nahrání ho
          # napořád přeskakuje. Zaškrtnuté "plne_nahrani" použije jiný název
          # stavového souboru, takže se server tváří jako prázdný a nahraje se
          # všechno. Nic se přitom nemaže.
          state-name: ${{ inputs.plne_nahrani && format('.ftp-deploy-state-{0}.json', github.run_number) || '.ftp-deploy-sync-state.json' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            functions/**
            *.py
            PLAN.md
            data/*.csv
            **/*.wav
            **/*.mp3
