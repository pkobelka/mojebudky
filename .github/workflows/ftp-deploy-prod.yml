name: Deploy na WEDOS FTP (produkce)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Jen nanečisto (nic se nenahraje, jen se vypíše, co by se změnilo)'
        type: boolean
        default: true
      plne_nahrani:
        description: 'Nahrát VŠECHNY soubory znovu (když na webu něco chybí)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vygeneruj číslo verze a vynuť čerstvou cache
        run: |
          sed -i "s/__MB_VERZE__/${{ github.run_number }}/; s/__MB_CAS__/$(TZ='Europe/Prague' date '+%-d.%-m.%Y %H:%M')/" index.html

      - name: Nahraj na produkční FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_PROD_USERNAME }}
          password: ${{ secrets.FTP_PROD_PASSWORD }}
          # Kořen tohoto účtu je hlavní (ostrý) web; _test níže je testovací verze a nesmí se jí sáhat
          server-dir: /
          dry-run: ${{ github.event.inputs.dry_run }}
          # Deploy porovnává soubory se stavem zapsaným v .ftp-deploy-sync-state.json
          # NA SERVERU, ne se skutečným obsahem. Když soubor ze serveru zmizí jinak
          # než deployem, stav o tom neví a nahrávání ho už napořád přeskakuje –
          # v logu se tváří jako „File content is the same". Zaškrtnuté
          # „plne_nahrani" použije jiný název stavového souboru, takže se server
          # tváří jako prázdný a nahraje se všechno. Nic se přitom nemaže.
          state-name: ${{ github.event.inputs.plne_nahrani == 'true' && format('.ftp-deploy-state-{0}.json', github.run_number) || '.ftp-deploy-sync-state.json' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            functions/**
            *.py
            PLAN.md
            data/*.csv
            **/*.wav
            **/*.mp3
            _test/**
