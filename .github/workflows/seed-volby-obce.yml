name: Seed Volby (volby_obce)

on:
  workflow_dispatch:

jobs:
  seed-volby-obce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nastav Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaluj zavislosti
        run: pip install firebase-admin

      - name: Uloz service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account-key.json

      - name: Naplni volby_obce
        run: python seed_volby_obce.py
